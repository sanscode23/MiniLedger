services:
  postgres:
    image: postgres:16-alpine
    container_name: miniledger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miniledger"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
